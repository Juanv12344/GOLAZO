<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golazo – Fútbol en vivo y repeticiones</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--surface:#fff;--surface2:#E3E9F2;--text:#10223F;--muted:#5A6B86;--line:#CBD5E4;--accent:#0F7B4B;--live:#D62F2F;--on:#fff}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0C1A33;--surface:#14284A;--surface2:#1B3560;--text:#EAF0F9;--muted:#9FB0CC;--line:#27426F;--accent:#4CC38A;--live:#FF5656;--on:#0C1A33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0 10px}
.logo{font:800 34px/1 "Barlow Condensed",Impact,sans-serif}.logo i{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.tab,.btn{border:1px solid var(--line);background:none;color:var(--text);padding:8px 18px;border-radius:20px;font:inherit;cursor:pointer}
.tab[aria-pressed="true"],.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.tab.l[aria-pressed="true"]{background:var(--live);border-color:var(--live);color:#fff}
.filters{display:grid;grid-template-columns:2fr 1.2fr .8fr 1fr;gap:10px;position:sticky;top:0;background:var(--bg);padding:10px 0 12px;z-index:5;border-bottom:1px solid var(--line)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input,select{width:100%;padding:10px 12px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.setup{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:14px 16px;margin:10px 0;font-size:15px}
.setup ol{margin:6px 0 10px;padding-left:20px;color:var(--muted)}
.setup .r{display:flex;gap:8px;flex-wrap:wrap}.setup input{flex:1;min-width:220px}
.msg{padding:30px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);margin-top:14px}
.err{color:var(--live)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer;display:flex;flex-direction:column}
.card:hover{background:var(--surface2)}
.th{position:relative;aspect-ratio:16/9;background:var(--surface2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;background:var(--live);color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:3px}
.ct{padding:10px 12px 12px}.ct b{display:block;font-weight:600;line-height:1.25;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ct span{font-size:13px;color:var(--muted)}
h2{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:22px 0 0}
dialog{border:0;padding:0;width:calc(100% - 24px);max-width:860px;background:var(--surface);color:var(--text);border-radius:10px}
dialog::backdrop{background:rgba(5,12,28,.8)}
.dh{display:flex;justify-content:space-between;gap:10px;padding:14px 16px}.dh h3{margin:0;font:700 22px/1.2 "Barlow Condensed",sans-serif}.dh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{border:1px solid var(--line);background:none;color:var(--text);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none}
.scr{aspect-ratio:16/9;background:#000}.scr iframe{width:100%;height:100%;border:0;display:block}
.blk{height:100%;display:grid;place-items:center;text-align:center;color:#fff;padding:24px;font-size:15px;line-height:1.5}.blk b{display:block;font-size:18px;margin-bottom:6px}
.dim{opacity:.5}.dim .th::after{content:"No disponible aquí";position:absolute;right:8px;bottom:8px;background:#000c;color:#fff;font-size:12px;padding:2px 8px;border-radius:3px}
.more{text-align:center;margin:18px 0}
@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters div:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
<header><div><div class="logo">GOL<i>AZO</i></div><small style="color:var(--muted);font-size:12px">versión 9 · 24 partidos</small></div><button class="btn" id="keyBtn" type="button">Clave de YouTube</button></header>

<div class="tabs" role="group" aria-label="Tipo">
  <button class="tab l" data-m="live" aria-pressed="false">En vivo</button>
  <button class="tab" data-m="replay" aria-pressed="true">Repeticiones y resúmenes</button>
</div>

<div class="filters">
  <div><label for="q">Buscar partido o equipo</label><input id="q" type="search" placeholder="Ej: Brasil Alemania, final, Messi"></div>
  <div><label for="comp">Copa o torneo</label><select id="comp"></select></div>
  <div><label for="year">Año</label><select id="year"></select></div>
  <div><label for="kind">Video</label><select id="kind"><option value="">Todos</option><option value="full">Partido completo</option><option value="hl">Resumen</option></select></div>
</div>

<div id="setup"></div>
<div id="out"></div>
<div class="more"><button class="btn" id="more" type="button" hidden>Ver más resultados</button></div>
</div>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><div><h3 id="dt"></h3><p id="ds"></p></div><button class="x" id="close" type="button" aria-label="Cerrar">×</button></div>
  <div class="scr" id="scr"></div>
  <p id="diag" style="margin:0;padding:8px 16px 12px;font-size:12px;color:var(--muted)"></p>
</dialog>

<script>
var FIFA="UCpcTrCXblq78GZrTUTLWeBw";
var CAT=[];
function m(id,h,a,hs,as,n,c,d,st,k,ch){CAT.push({id:id,h:h,a:a,hs:hs,as:as,n:n,c:c,d:d,y:d.slice(0,4),st:st,k:k,ch:ch})}
/* id de YouTube, local, visitante, goles, goles, nota, copa, fecha, fase, tipo (full|hl), canal */
m("1nqLwWdDovs","Brasil","Alemania",1,7,"","Mundial masculino","2014-07-08","Semifinal","hl","");
m("GrsEAvRerTg","Francia","Croacia",4,2,"","Mundial masculino","2018-07-15","Final","hl","");
m("nXUx_G4w79o","Argentina","Francia",3,3,"Penales 4-2","Mundial masculino","2022-12-18","Final","hl","");
m("ForRynxB_oQ","Colombia","Paraguay",2,1,"","Copa América","2024-06-24","Fase de grupos","hl","CONMEBOL");
m("bSOanKfF4AE","Colombia","Costa Rica",3,0,"","Copa América","2024-06-28","Fase de grupos","hl","CONMEBOL");
m("KBFbsyogwR4","Colombia","Panamá",5,0,"","Copa América","2024-07-06","Cuartos de final","hl","Optus Sport");
m("_FFFuHlFlKw","Uruguay","Colombia",0,1,"","Copa América","2024-07-10","Semifinal","hl","CONMEBOL");
m("1x3gtW-JcEY","Argentina","Colombia",1,0,"Tras prórroga","Copa América","2024-07-14","Final","hl","");
m("zbydyLmiudQ","España","Inglaterra",2,1,"","Eurocopa","2024-07-14","Final","hl","");
m("FfVo-tCU3S4","PSG","Inter",5,0,"","Champions League","2025-05-31","Final","hl","Stan Sport");
m("rHWYeZ6TN1c","Atlético Mineiro","Botafogo",1,3,"","Copa Libertadores","2024-11-30","Final","full","CONMEBOL Libertadores");
m("4K5ABshudJo","Atlético Mineiro","Botafogo",1,3,"","Copa Libertadores","2024-11-30","Final","hl","Paramount+ Brasil");
m("RNLHetAesTs","España","Argentina",1,0,"Tras prórroga","Mundial masculino","2026-07-19","Final","hl","SBS Sport");
m("y-4saPWrPt0","Inglaterra","Argentina",1,2,"","Mundial masculino","2026-07-15","Semifinal","hl","");
m("0Q0VdF01D4Y","Argentina","Suiza",3,1,"Tras prórroga","Mundial masculino","2026-07-11","Cuartos de final","hl","SBS Sport");
m("_uEzppRKcd0","Suiza","Colombia",0,0,"Penales 4-3","Mundial masculino","2026-07-07","Octavos de final","hl","");
m("2Lw8B3RwITw","Colombia","Ghana",1,0,"","Mundial masculino","2026-07-03","Dieciseisavos de final","hl","");
m("WRw6B3YxBZQ","Colombia","Portugal",0,0,"","Mundial masculino","2026-06-27","Fase de grupos","hl","");
m("C-bTb3K_suE","Colombia","RD Congo",1,0,"","Mundial masculino","2026-06-23","Fase de grupos","hl","");
m("5NPLHqF_tIo","Chelsea","PSG",3,0,"","Mundial de Clubes","2025-07-13","Final","hl","");
m("A3t_uUgTm5k","Chelsea","PSG",3,0,"","Mundial de Clubes","2025-07-13","Final","hl","DAZN");
m("rOg_T0ZlYz4","Palmeiras","Flamengo",0,1,"","Copa Libertadores","2025-11-29","Final","hl","CONMEBOL");
m("6tLxv5EsszA","Brasil","Argentina",0,1,"","Copa América","2021-07-10","Final","hl","CONMEBOL");
m("Q-s0OqlZnMY","Liverpool","Real Madrid",0,1,"","Champions League","2022-05-28","Final","hl","");
var ALT={
 "0Q0VdF01D4Y":[["raGsExyiaS8",""]],
 "_uEzppRKcd0":[["9jnH5q3zTAc",""]],
 "C-bTb3K_suE":[["PRvX5k4ejns","SBS"]],
 "1nqLwWdDovs":[["jiGdTbo7hw4",""]]
};
CAT.sort(function(a,b){return a.d<b.d?1:-1});

var COMPS=[["","Todas las copas",""],["Mundial masculino","Mundial masculino","FIFA World Cup"],["Mundial femenino","Mundial femenino","FIFA Women's World Cup"],["Mundial de Clubes","Mundial de Clubes","FIFA Club World Cup"],["Mundial Sub-20","Mundial Sub-20","FIFA U-20 World Cup"],["Copa Confederaciones","Copa Confederaciones","FIFA Confederations Cup"],["Copa América","Copa América","Copa América"],["Eurocopa","Eurocopa","Eurocopa UEFA Euro"],["Champions League","Champions League","UEFA Champions League"],["Copa Libertadores","Copa Libertadores","Copa Libertadores"],["LaLiga","LaLiga","LaLiga"],["Premier League","Premier League","Premier League"]];
var ALIAS={brasil:"brazil",alemania:"germany",francia:"france",croacia:"croatia",inglaterra:"england","españa":"spain",polonia:"poland",japon:"japan",mundial:"world cup",eurocopa:"euro",panama:"panama",italia:"italy",holanda:"netherlands"};
var $=function(i){return document.getElementById(i)};
var KEY="",mode="replay",next="",busy=false;
try{KEY=localStorage.getItem("yt_key")||""}catch(e){}

COMPS.forEach(function(c){var o=document.createElement("option");o.value=c[0];o.textContent=c[1];$("comp").appendChild(o)});
var yo='<option value="">Todos los años</option>';for(var y=2026;y>=2014;y--)yo+='<option>'+y+'</option>';$("year").innerHTML=yo;

function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function dec(s){var d=document.createElement("textarea");d.innerHTML=s;return d.value}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fd(d){var p=d.split("-");return +p[2]+" "+MES[+p[1]-1]+" "+p[0]}

function showSetup(){
  $("setup").innerHTML='<div class="setup"><b>Conecta YouTube para buscar todos los partidos desde 2014</b>'+
  '<ol><li>Entra a console.cloud.google.com y crea un proyecto gratis.</li><li>Activa «YouTube Data API v3» y crea una clave de API.</li><li>Pégala aquí. Se guarda solo en tu navegador.</li></ol>'+
  '<div class="r"><input id="k" type="password" placeholder="Tu clave de API" aria-label="Clave de API" value="'+esc(KEY)+'"><button class="btn p" id="ks" type="button">Guardar clave</button></div></div>';
  $("ks").onclick=function(){KEY=$("k").value.trim();try{localStorage.setItem("yt_key",KEY)}catch(e){}$("setup").innerHTML="";run(false)};
}
$("keyBtn").onclick=showSetup;

function card(v,live){
  var b=document.createElement("button");b.className="card";b.type="button";
  var sub=v.sub||((v.ch||"")+(v.d?' · '+v.d:''));
  b.innerHTML='<div class="th"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg">'+(live?'<span class="badge">EN VIVO</span>':'')+(v.tag?'<span class="badge" style="background:var(--accent);color:var(--on)">'+esc(v.tag)+'</span>':'')+'</div><div class="ct"><b>'+esc(v.t)+'</b><span>'+esc(sub)+'</span></div>';
  if(BAD[v.id])b.classList.add("dim");b.onclick=function(){curBtn=b;open_(v,live)};return b}

var BAD={};try{BAD=JSON.parse(localStorage.getItem("yt_bad2")||"{}")}catch(e){}
function markBad(id){BAD[id]=1;try{localStorage.setItem("yt_bad2",JSON.stringify(BAD))}catch(e){}}
var curBtn=null,mainId="",queue=[],baseSub="",frame=null,cur=null,seq=0,total=0,got=false,wd=null;
function diag(t){$("diag").textContent=t}
function blocked(){
  $("scr").innerHTML='<div class="blk"><div><b>Este video no se puede ver dentro de la página</b>Aunque en YouTube sí se vea, su dueño no permite reproducirlo en otras páginas. Prueba con otro partido, o usa la búsqueda con tu clave de YouTube, que solo trae videos que sí se pueden integrar.</div></div>';
  $("ds").textContent=baseSub;frame=null}
function playNext(){
  if(!queue.length){blocked();return}
  cur=queue.shift();seq++;got=false;clearTimeout(wd);
  diag("Fuente "+seq+" de "+total+" · código "+cur[0]+" · cargando…");
  var origin=/^https?:/.test(location.protocol)?"&origin="+encodeURIComponent(location.origin):"";
  var f=document.createElement("iframe");
  f.src="https://www.youtube.com/embed/"+cur[0]+"?autoplay=1&rel=0&playsinline=1&enablejsapi=1"+origin;
  f.title="Reproductor";
  f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.setAttribute("allowfullscreen","");
  f.referrerPolicy="strict-origin-when-cross-origin";
  f.onload=function(){try{f.contentWindow.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*")}catch(e){}};
  $("scr").innerHTML="";$("scr").appendChild(f);frame=f;
  var mine=cur;
  wd=setTimeout(function(){if(!got&&cur===mine)diag("Fuente "+seq+" de "+total+" · código "+mine[0]+" · el reproductor no respondió en 8 segundos. Revisa si un bloqueador de anuncios o la red bloquea youtube.com.")},8000);
}
window.addEventListener("message",function(e){
  if(!frame||e.source!==frame.contentWindow)return;
  var d;try{d=typeof e.data==="string"?JSON.parse(e.data):e.data}catch(x){return}
  if(!d)return;
  if(!got){got=true;diag("Fuente "+seq+" de "+total+" · código "+cur[0]+" · conectado")}
  if(d.event!=="onError")return;
  var c=d.info;
  diag("Fuente "+seq+" de "+total+" · código "+cur[0]+" · YouTube devolvió el error "+c);
  if(c===153){$("scr").innerHTML='<div class="blk"><div><b>Abre la página desde un sitio web</b>YouTube no deja reproducir videos cuando el archivo se abre con doble clic. Súbelo a Netlify Drop o ábrelo con un servidor local (python3 -m http.server).</div></div>';return}
  if([100,101,150,152].indexOf(c)>=0){
    markBad(cur[0]);if(cur[0]===mainId&&curBtn)curBtn.classList.add("dim");
    $("ds").textContent=baseSub+" · probando otra fuente…";playNext()}
});
function open_(v,live){
  $("dt").textContent=v.t;baseSub=v.sub||(v.ch||"")+(live?" · En vivo":"");$("ds").textContent=baseSub;
  mainId=v.id;queue=[[v.id,v.ch]];
  (ALT[v.id]||[]).forEach(function(a){queue.push(a)});
  if(v.key)CAT.forEach(function(x){if(x.id!==v.id&&x.h+x.a+x.d===v.key&&queue.every(function(q){return q[0]!==x.id}))queue.push([x.id,x.ch])});
  queue=queue.filter(function(q){return !BAD[q[0]]});
  total=queue.length;seq=0;
  $("dlg").showModal();playNext()}
$("close").onclick=function(){$("dlg").close()};
$("dlg").addEventListener("close",function(){queue=[];frame=null;clearTimeout(wd);diag("");$("scr").innerHTML=""});
$("dlg").addEventListener("click",function(e){if(e.target===$("dlg"))$("dlg").close()});

function msg(t,err){var d=document.createElement("div");d.className="msg"+(err?" err":"");d.innerHTML=t;return d}
function grid(){var g=document.createElement("div");g.className="grid";return g}
function head(t){var h=document.createElement("h2");h.textContent=t;return h}

function localMatches(){
  var q=norm($("q").value.trim()).split(/\s+/).filter(Boolean),c=$("comp").value,y=$("year").value,k=$("kind").value;
  return CAT.filter(function(x){
    if(c&&x.c!==c)return false;
    if(y&&x.y!==y)return false;
    if(k&&x.k!==k)return false;
    var hay=norm([x.h,x.a,x.c,x.st,x.y,x.ch,x.k==="full"?"partido completo":"resumen highlights"].join(" "));
    var extra="";Object.keys(ALIAS).forEach(function(w){if(hay.indexOf(w)>=0)extra+=" "+ALIAS[w]});hay+=extra;
    return q.every(function(t){return hay.indexOf(t)>=0})}).sort(function(a,b){return (BAD[a.id]?1:0)-(BAD[b.id]?1:0)});
}
function toV(x){
  return {key:x.h+x.a+x.d,id:x.id,t:x.h+" "+x.hs+" – "+x.as+" "+x.a,tag:x.k==="full"?"Completo":"Resumen",
    sub:x.c+" "+x.y+" · "+x.st+(x.n?" · "+x.n:"")+" · "+fd(x.d)+(x.ch?" · "+x.ch:"")}}

function ytQuery(){
  var q=$("q").value.trim(),cs=COMPS.filter(function(c){return c[0]===$("comp").value})[0],y=$("year").value,k=$("kind").value;
  var p=[q,cs?cs[2]:"",mode==="live"?"":y];
  if(mode==="replay"){if(k==="full")p.push("FULL MATCH partido completo");if(k==="hl")p.push("Highlights resumen")}
  return p.filter(Boolean).join(" ")||(mode==="live"?"fútbol en vivo":"fútbol partido")}

function run(append){
  if(append){fetchYT(true);return}
  next="";$("more").hidden=true;$("out").innerHTML="";
  if(mode==="replay"){
    var L=localMatches();
    if(L.length){$("out").appendChild(head("Partidos del catálogo ("+L.length+")"));var g=grid();L.forEach(function(x){g.appendChild(card(toV(x)))});$("out").appendChild(g)}
    else if(!KEY){$("out").appendChild(msg("No hay partidos del catálogo con esos filtros. Prueba otra copa u otro año, o conecta tu clave de YouTube (botón arriba) para buscar en todo YouTube."))}
    if(!KEY){
      if(L.length)$("out").appendChild(msg("¿Buscas otro partido? Conecta tu clave de YouTube (botón «Clave de YouTube») para buscar todos los partidos desde 2014."));
      return}
  } else if(!KEY){$("out").appendChild(msg("Para ver partidos en vivo conecta tu clave de YouTube (botón arriba a la derecha)."));return}
  fetchYT(false);
}

function fetchYT(append){
  if(busy)return;busy=true;
  var u="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=24&q="+encodeURIComponent(ytQuery())+"&regionCode=CO&relevanceLanguage=es&videoSyndicated=true&key="+encodeURIComponent(KEY);
  if(mode==="live")u+="&eventType=live";
  if(append&&next)u+="&pageToken="+next;
  fetch(u).then(function(r){return r.json()}).then(function(d){
    busy=false;
    if(d.error){$("out").appendChild(msg("YouTube respondió: "+esc(d.error.message)+" Revisa tu clave o intenta mañana si se acabó la cuota.",true));return}
    var have={};CAT.forEach(function(x){have[x.id]=1});
    var it=(d.items||[]).filter(function(x){return x.id&&x.id.videoId&&(mode==="live"||!have[x.id.videoId])});
    var g=$("out").querySelector(".yt");
    if(!g){
      if(!it.length&&!append){$("out").appendChild(msg(mode==="live"?"No hay partidos en vivo con esos filtros ahora mismo. Prueba con otra copa o con «Todos los canales».":"YouTube no devolvió más videos con esos filtros."));return}
      if(mode==="replay"&&$("out").children.length)$("out").appendChild(head("Más resultados de YouTube"));
      g=grid();g.className="grid yt";$("out").appendChild(g)}
    it.forEach(function(x){g.appendChild(card({id:x.id.videoId,t:dec(x.snippet.title),ch:dec(x.snippet.channelTitle),d:(x.snippet.publishedAt||"").slice(0,10)},mode==="live"))});
    next=d.nextPageToken||"";$("more").hidden=!next;
  }).catch(function(){busy=false;$("out").appendChild(msg("No se pudo conectar con YouTube. Revisa tu conexión.",true))});
}
$("more").onclick=function(){run(true)};

var tm;$("q").addEventListener("input",function(){clearTimeout(tm);tm=setTimeout(function(){run(false)},500)});
["comp","year","kind"].forEach(function(i){$(i).addEventListener("change",function(){run(false)})});
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){
  mode=b.dataset.m;document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
  $("year").disabled=$("kind").disabled=(mode==="live");run(false)}});
run(false);
</script>
</body>
</html>
